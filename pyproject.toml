[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flickr-autotagger"
version = "0.1.0"
description = "AI-powered Flickr photo tagger using CLIP zero-shot classification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "maximusmaximus" },
]
keywords = ["flickr", "clip", "tagging", "ai", "photos", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "flickrapi>=2.4",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "click>=8.0",
    "open-clip-torch>=2.20",
    "Pillow>=10.0",
    "aiohttp>=3.9",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.5",
    "ruff>=0.1",
]
docs = [
    "mkdocs-material>=9.0",
]

[project.scripts]
flickr-autotagger = "flickr_autotagger.cli:cli"

[project.urls]
Homepage = "https://github.com/maximusmaximus/flickrtag"
Repository = "https://github.com/maximusmaximus/flickrtag"
Issues = "https://github.com/maximusmaximus/flickrtag/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
